name: One-off YouTube backfill

# Runs once to find a YouTube version of every song already in the playlist, using the
# unofficial YouTube Music search (no key, no daily limit). Delete this file afterwards;
# the daily refresh keeps new songs matched with the official API.
on:
  push:
    branches: [main]
    paths: [".github/workflows/youtube-backfill.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ytmusicapi
      - name: Match every song
        run: python scripts/youtube.py --mode unofficial
      - name: Save matches
        run: |
          git config user.name "playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/youtube.json
          git commit -m "Add YouTube matches for existing songs" || echo "Nothing new"
          git push
