name: Refresh playlist explorer

on:
  schedule:
    # Daily at 4:07am UK time. GitHub schedules run in UTC and the UK shifts
    # between GMT and BST, so both slots fire and the gate below keeps the one
    # that is 4am in London.
    - cron: "7 3 * * *"
    - cron: "7 4 * * *"
  workflow_dispatch:           # adds a "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "scripts/build.py", "data/tracks.json"]

permissions:
  contents: write   # save new tags back to the repo
  models: read      # free GitHub Models access for tagging
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/London date +%H)" = "04" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        if: github.event_name != 'push'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Read the playlist
        if: github.event_name != 'push'
        run: python scripts/scrape.py

      - name: Tag new tracks
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/tag.py

      - name: Build page
        run: python scripts/build.py

      - name: Save data
        if: github.event_name != 'push'
        run: |
          # Commit only when the playlist changed. If nothing has been committed for
          # 40 days, write a timestamp so GitHub doesn't pause the schedule (it does
          # after 60 days without activity).
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3456000 ]; then date -u +"%Y-%m-%dT%H:%MZ" > data/last_checked.txt; fi
          git config user.name "playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh playlist data" || echo "Nothing new"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
