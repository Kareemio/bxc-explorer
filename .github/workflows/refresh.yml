name: Refresh playlist explorer

on:
  schedule:
    - cron: "17 10 */2 * *"   # every other day, 10:17 UTC (about 6am in Washington)
  workflow_dispatch:           # adds a "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "scripts/build.py", "data/tracks.json"]

permissions:
  contents: write   # save new tags back to the repo
  models: read      # free GitHub Models access for tagging
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        if: github.event_name != 'push'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Read the playlist
        if: github.event_name != 'push'
        run: python scripts/scrape.py

      - name: Tag new tracks
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/tag.py

      - name: Build page
        run: python scripts/build.py

      - name: Save data
        if: github.event_name != 'push'
        run: |
          date -u +"%Y-%m-%dT%H:%MZ" > data/last_checked.txt
          git config user.name "playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh playlist data" || echo "Nothing new"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
